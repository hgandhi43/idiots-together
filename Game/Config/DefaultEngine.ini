[/Script/Engine.RendererSettings]
; Optimization for GTX 1650 4GB VRAM & 16GB System RAM
r.DynamicGlobalIlluminationMethod=0 ; 0 = None / Static Lightmaps (disables heavy Lumen GI)
r.ReflectionMethod=1 ; 1 = Screen Space Reflections (SSR)
r.ShadowQuality=2 ; Medium Shadows
r.Nanite=0 ; Disable Nanite Virtual Geometry fallback
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.MotionBlur=0 ; Disable motion blur for crisp clarity
r.DefaultFeature.AntiAliasing=2 ; TAA
r.TextureStreaming=1
r.Streaming.PoolSize=2048 ; Allocated 2 GB Texture Streaming Pool for 4 GB VRAM GPU

[/Script/Engine.GarbageCollectionSettings]
gc.TimeBetweenPurgingPendingKillObjects=60

